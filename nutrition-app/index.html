<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f7254"><title>日日好食</title><link rel="stylesheet" href="style.css?v=20260811.3"><link rel="stylesheet" href="style-extra.css?v=20260811.3"></head>
<body>
<header><div><small>FAMILY NUTRITION JOURNAL</small><h1>日日好食</h1></div></header>
<main>
  <section id="membersView"><div class="hero"><p>每位家庭成員都有自己的飲食紀錄。</p><h2>今天要為誰記錄？</h2></div><div id="members" class="member-grid"></div><button id="newMemberBtn" class="add-card">＋ 新增家庭成員</button></section>
  <section id="homeView" class="hidden">
    <div class="active-member"><img id="activeAvatar" alt="個人頭像"><div><span id="activeMode"></span><h2 id="activeName"></h2></div><button id="editMemberBtn">資料</button><button id="switchBtn">切換</button></div>
    <div class="summary"><article><small>總熱量</small><strong id="calories">—</strong><span>kcal</span></article><article><small>總蛋白質</small><strong id="protein">—</strong><span>g</span></article><article><small>總油脂</small><strong id="fat">—</strong><span>g</span></article><button id="waterCard" class="summary-card" type="button"><small>今日飲水</small><strong id="water">—</strong><span>ml・點選修改</span></button><button id="stepsCard" class="summary-card" type="button"><small>今日步數</small><strong id="steps">—</strong><span>步・點選修改</span></button></div>
    <button id="cameraBtn" class="primary camera">＋ 新增餐點</button>
    <div class="actions"><button id="adviceBtn">今天還缺什麼？</button><button id="weeklyBtn">查看七日報告</button></div>
    <article class="panel"><h3>今日摘要</h3><p id="feedback" class="muted">尚未記錄餐點。</p></article>
    <article class="panel"><div class="panel-head"><h3>飲食紀錄</h3><input id="historyDate" type="date"></div><div id="mealList"></div></article>
  </section>
</main>
<footer class="app-version">版本 2026.08.11.3</footer>

<dialog id="memberDialog"><form id="memberForm"><div class="dialog-head"><h2>家庭成員</h2><button type="button" data-close>×</button></div><input type="hidden" name="member_id"><label>名稱<input name="name" maxlength="50" required></label><fieldset><legend>模式</legend><label><input type="radio" name="is_child" value="false" checked>成人</label><label><input type="radio" name="is_child" value="true">兒童</label></fieldset><div class="two"><label>生日<input type="date" name="birthday" required></label><label>性別<select name="sex"><option value="female">女性</option><option value="male">男性</option><option value="other">其他</option></select></label><label>身高 cm<input type="number" name="height_cm" min="30" max="250" step="0.1" required></label><label>體重 kg<input type="number" name="weight_kg" min="1" max="500" step="0.1" required></label></div><label>活動量<select name="activity_level"><option value="low">輕量：多數時間坐著、日常走動少</option><option value="moderate">一般：每天有走路或規律活動</option><option value="high">較高：勞動、運動或長時間走動</option></select></label><p class="muted">活動量與步數之後都能修改。</p><label>目前每日平均步數（選填）<input type="number" name="usual_daily_steps" min="0" max="100000" step="100" placeholder="不知道可留空"></label><label id="goalRow">成人目標<select name="goal"><option value="maintain">維持</option><option value="fat_loss">減脂</option><option value="muscle_gain">增肌</option></select></label><label>過敏食物（選填）<input name="allergy" maxlength="500"></label><fieldset><legend>個人圖片</legend><div id="avatars" class="avatars"></div><label class="avatar-upload">上傳自己的圖片<input id="avatarPhoto" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="customAvatarPreview" class="custom-avatar hidden" alt="自訂頭像"></fieldset><p id="memberFormStatus" class="muted" role="status"></p><button id="memberSubmitBtn" class="primary" type="submit">儲存</button></form></dialog>

<dialog id="photoDialog"><div class="dialog-head"><h2 id="photoDialogTitle">新增餐點</h2><button type="button" data-close>×</button></div><label>餐別<select id="mealType"><option value="breakfast">早餐</option><option value="brunch">早午餐</option><option value="lunch">午餐</option><option value="dinner">晚餐</option><option value="snack">點心</option></select></label><div id="captureStep"><div class="tips"><b>先把同一餐的照片加完，再一起分析</b><span>建議：一張正上方、一張 45°，也可補充包裝或營養標示。</span></div><div class="capture-actions"><label class="upload">立即拍照<input id="cameraPhotos" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"></label><label class="upload">從相簿選擇<input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><button id="manualBtn" type="button">不使用照片，手動輸入</button></div><div class="counter"><span id="photoCount">已加入 0 / 6 張</span><button id="clearPhotos">全部清除</button></div><div id="previews" class="previews"></div><button id="analyzeBtn" class="primary">照片都加完了，分析整份餐點</button></div><div id="reviewStep" class="hidden"><p id="reviewNotice" class="notice">以下皆為照片估算值，請確認後再保存。</p><div id="foodEditor"></div><button id="addManualFoodBtn" class="hidden" type="button">＋ 增加另一種食物</button><button id="saveMealBtn" class="primary">確認並保存這一餐</button></div></dialog>

<dialog id="infoDialog"><div class="dialog-head"><h2 id="infoTitle"></h2><button type="button" data-close>×</button></div><div id="infoBody"></div></dialog>
<div id="toast"></div><script src="api.js?v=20260811.3"></script><script src="app.js?v=20260811.3"></script>
</body></html>
